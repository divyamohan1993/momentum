name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Production dependency security audit
        run: pnpm audit --prod --audit-level=high

      - name: Brain regression tests
        run: pnpm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Workspace isolation integration tests
        run: pnpm test:workspaces

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
